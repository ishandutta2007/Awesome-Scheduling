<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 64px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 24px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 16px;
      fill: #e2e8f0;
    }
    .pulse-circle {
      animation: pulse 3s infinite ease-in-out;
      transform-origin: center;
    }
    .float-card {
      animation: float 4s infinite ease-in-out;
    }
    .float-card-delay {
      animation: float 4s infinite ease-in-out 2s;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs -->
  <circle cx="200" cy="100" r="180" fill="#6366f1" opacity="0.25" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1000" cy="300" r="220" fill="#a855f7" opacity="0.2" filter="url(#glow)" class="pulse-circle" style="animation-delay: 1.5s;" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Calendar Icon Graphic (Left) -->
  <g transform="translate(80, 110)" class="float-card">
    <rect width="160" height="180" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
    <path d="M 0 45 L 160 45" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
    <rect x="35" y="-10" width="16" height="30" rx="8" fill="#38bdf8" />
    <rect x="109" y="-10" width="16" height="30" rx="8" fill="#38bdf8" />
    <!-- Grid Dots -->
    <circle cx="45" cy="80" r="8" fill="#818cf8" />
    <circle cx="80" cy="80" r="8" fill="#38bdf8" />
    <circle cx="115" cy="80" r="8" fill="rgba(255, 255, 255, 0.2)" />
    <circle cx="45" cy="115" r="8" fill="rgba(255, 255, 255, 0.2)" />
    <circle cx="80" cy="115" r="8" fill="#c084fc" />
    <circle cx="115" cy="115" r="8" fill="#38bdf8" />
    <circle cx="45" cy="150" r="8" fill="#38bdf8" />
    <circle cx="80" cy="150" r="8" fill="rgba(255, 255, 255, 0.2)" />
    <circle cx="115" cy="150" r="8" fill="#818cf8" />
  </g>

  <!-- Clock & Sync Graphic (Right) -->
  <g transform="translate(960, 120)" class="float-card-delay">
    <circle cx="80" cy="80" r="75" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />
    <path d="M 80 35 V 80 L 110 100" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <circle cx="80" cy="80" r="8" fill="#c084fc" />
  </g>

  <!-- Title & Description Text -->
  <g transform="translate(290, 160)">
    <text x="0" y="0" class="title">📅 Awesome-Scheduling</text>
    <text x="5" y="48" class="subtitle">Curated SaaS &amp; Open-Source Scheduling Tools</text>
    
    <!-- Feature Chips -->
    <g transform="translate(5, 90)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="170" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="85" y="23" text-anchor="middle" class="badge-text" fill="#38bdf8">⚡ Appointment</text>

      <!-- Chip 2 -->
      <rect x="185" y="0" width="170" height="36" rx="18" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="1.5"/>
      <text x="270" y="23" text-anchor="middle" class="badge-text" fill="#818cf8">🔄 Calendar Sync</text>

      <!-- Chip 3 -->
      <rect x="370" y="0" width="170" height="36" rx="18" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="1.5"/>
      <text x="455" y="23" text-anchor="middle" class="badge-text" fill="#c084fc">🔒 Self-Hosted</text>
    </g>
  </g>
</svg>
